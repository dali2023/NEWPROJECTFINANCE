# ---------------------------------------------------------------------------
# ONE ERP Finance & Project Control — environnement de développement
#
#   docker compose up -d          démarre php-fpm, nginx, PostgreSQL, Mailpit
#   docker compose exec php bash  accès au conteneur applicatif
#   http://localhost:8090         application
#   http://localhost:8025         boîte mail de test (Mailpit)
#   localhost:5433                PostgreSQL (depuis l'hôte)
# ---------------------------------------------------------------------------
name: one-erp-finance

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: one-erp-finance/php:dev
    container_name: oneerp_php
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
      # Vendor et cache sont conservés dans des volumes Docker : les lire depuis
      # le volume partagé Windows coûte plusieurs dizaines de secondes par
      # requête. Le code source reste monté depuis l'hôte pour l'édition.
      - vendor:/var/www/html/vendor
      - app_var:/var/www/html/var
      - ./storage:/var/www/storage
    environment:
      # APP_ENV, DATABASE_URL et MAILER_DSN sont définis par app/.env (dev) et
      # app/.env.test (tests). Les exporter ici empêcherait Symfony de charger
      # la configuration de test : ne pas les dupliquer dans ce fichier.
      XDEBUG_MODE: "off"
      TZ: Africa/Tunis
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oneerp

  nginx:
    image: nginx:1.27-alpine
    container_name: oneerp_nginx
    ports:
      - "${HTTP_PORT:-8090}:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - oneerp

  postgres:
    image: postgres:16-alpine
    container_name: oneerp_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-one_erp_finance}
      POSTGRES_USER: ${POSTGRES_USER:-one_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-one_erp_dev}
      TZ: Africa/Tunis
      PGTZ: Africa/Tunis
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-one_erp} -d ${POSTGRES_DB:-one_erp_finance}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - oneerp

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: oneerp_mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - oneerp

  adminer:
    image: adminer:4
    container_name: oneerp_adminer
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - oneerp
    profiles: ["tools"]

volumes:
  pgdata:
  vendor:
  app_var:

networks:
  oneerp:
    driver: bridge
