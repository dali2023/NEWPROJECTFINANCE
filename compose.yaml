services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?APP_SECRET absent}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8"
      MAILER_DSN: "smtp://mailpit:1025"
    volumes:
      - ./app:/var/www/html
      - vendor:/var/www/html/vendor
      - app_var:/var/www/html/var
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - backend
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.pilotage.rule=Host(`pilotage.oneerp.tn`)"
      - "traefik.http.routers.pilotage.entrypoints=websecure"
      - "traefik.http.routers.pilotage.tls=true"
      - "traefik.http.routers.pilotage.tls.certresolver=le"
      - "traefik.http.services.pilotage.loadbalancer.server.port=80"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB absent}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER absent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD absent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    networks:
      - backend


  adminer:
    image: adminer:latest
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db
    networks:
      - backend
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.dbadmin.rule=Host(`dbadmin.oneerp.tn`)"
      - "traefik.http.routers.dbadmin.entrypoints=websecure"
      - "traefik.http.routers.dbadmin.tls=true"
      - "traefik.http.routers.dbadmin.tls.certresolver=le"
      - "traefik.http.routers.dbadmin.middlewares=dbadmin-auth"
      - "traefik.http.middlewares.dbadmin-auth.basicauth.users=one_erp:$$2y$$05$$vQWIt3snWN98DB1kYSlpVuPC/k2yd26wJ18OAN2GC7qSqp5ZeQEq."
      - "traefik.http.services.dbadmin.loadbalancer.server.port=8080"

volumes:
  postgres_data:
  vendor:
  app_var:

networks:
  backend:
  proxy:
    external: true
