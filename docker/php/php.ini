; ---------------------------------------------------------------------------
; ONE ERP Finance & Project Control — configuration PHP (développement)
; ---------------------------------------------------------------------------
date.timezone = Africa/Tunis
default_charset = "UTF-8"

memory_limit = 512M
max_execution_time = 120
post_max_size = 32M
upload_max_filesize = 24M

; Erreurs affichées en développement uniquement
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

; Opcache (performances)
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; vendor/ et var/ sont montés dans des volumes Docker : la validation des
; horodatages reste peu coûteuse et le code est rechargé automatiquement.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Sessions
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.gc_maxlifetime = 28800

; Fuseau et locale pour intl
intl.default_locale = fr_FR
