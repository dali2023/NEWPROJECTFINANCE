server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    # Sécurité de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Les justificatifs sont stockés hors du répertoire public : aucune
    # requête directe sur /var/... n'est possible, seulement via PHP.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS $https if_not_empty;
        # Montée en charge initiale (cache Symfony à froid) sur volumes Windows.
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Assets versionnés (cache long)
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
