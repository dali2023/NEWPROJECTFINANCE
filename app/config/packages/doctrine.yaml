# Configuration Doctrine — PostgreSQL 16 (§5.1)
doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '16'
        charset: utf8
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        # Table de séquences métier gérée par la migration initiale (upsert
        # atomique) : exclue du schéma Doctrine pour éviter toute suppression
        # accidentelle par doctrine:schema:update.
        schema_filter: '~^(?!reference_sequences$)~'
        # Type UUID natif PostgreSQL, converti en Symfony Uid côté PHP.
        types:
            uuid: Symfony\Bridge\Doctrine\Types\UuidType
        # Options de session garantissant l'exactitude des calculs financiers.
        options:
            # Les montants doivent respecter les contraintes, pas être arrondis
            # silencieusement par le serveur.
            'application_name': 'one_erp_finance'
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
